<meta property="og:title" content="장효원 Portfolio">
<meta property="og:description" content="백엔드 개발자 장효원의 포트폴리오 — SSUport, 캥거루틴, 싹싹푸드 등 실제로 쓰이는 서비스를 만들고 운영한 기록.">

<title>장효원 Portfolio</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: case-study template — sticky top nav, roomy white sections, one blue accent, light-blue bands to separate chapters */
:root{
  --bg:#ffffff;
  --band:#f5f9ff;
  --surface:#ffffff;
  --line:#e3e9f3;
  --fg:#252b42;
  --fg-2:#5b6278;
  --fg-3:#8b91a4;
  --accent:#1b86ec;
  --accent-soft:#e7f2fe;
  --accent-ink:#ffffff;
  --done:#1f9d6b; --done-soft:#e4f6ee;
  --plan:#e8655f; --plan-soft:#fdecea;
  --code-bg:#252b42; --code-fg:#dfe6f5; --code-key:#7cc3ff; --code-str:#b6e3a8; --code-num:#ffc98a;
  --shadow:0 18px 40px -24px rgba(37,43,66,.35);
  --display:"Poppins","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR","Poppins",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1424;--band:#141b2f;--surface:#18203a;--line:#26304d;--fg:#e8ecf6;--fg-2:#aab2c8;--fg-3:#7b84a0;
  --accent:#5cb1f7;--accent-soft:#1a2c4a;--accent-ink:#0f1424;--done:#4fd09a;--done-soft:#153429;--plan:#f2877f;--plan-soft:#3a1f22;
  --code-bg:#0b1020;--shadow:0 18px 40px -24px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1424;--band:#141b2f;--surface:#18203a;--line:#26304d;--fg:#e8ecf6;--fg-2:#aab2c8;--fg-3:#7b84a0;
  --accent:#5cb1f7;--accent-soft:#1a2c4a;--accent-ink:#0f1424;--done:#4fd09a;--done-soft:#153429;--plan:#f2877f;--plan-soft:#3a1f22;
  --code-bg:#0b1020;--shadow:0 18px 40px -24px rgba(0,0,0,.7);color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.3;letter-spacing:-.01em}
p{margin:0}
ul{margin:0;padding-left:1.1em}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.narrow{max-width:820px}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.brand{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.01em;white-space:nowrap;text-decoration:none}
.brand i{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700}
.menu{display:flex;gap:4px;align-items:center}
.menu a{font-family:var(--display);font-size:15px;font-weight:500;text-decoration:none;color:var(--fg-2);padding:8px 14px;border-radius:999px}
.menu a:hover{color:var(--fg)}
.menu a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.nav-soc{display:flex;gap:2px;margin-left:8px;padding-left:10px;border-left:1px solid var(--line)}
.nav-soc a{width:36px;height:36px;display:grid;place-items:center;border-radius:999px;color:var(--fg-2)}
.nav-soc a:hover{background:var(--band);color:var(--fg)}
.nav-soc a.ts{color:#eb531f}
@media (max-width:640px){.nav-soc{display:none}}
.theme-btn{border:1px solid var(--line);background:transparent;color:var(--fg-2);width:36px;height:36px;border-radius:999px;cursor:pointer;margin-left:6px;font-size:15px}
@media (max-width:560px){.nav .wrap{gap:8px}.menu{gap:0}.menu a{padding:7px 6px;font-size:13px}.brand{font-size:13.5px}.theme-btn{margin-left:2px;width:32px;height:32px}.sc-cap{font-size:11.5px;padding:9px 12px;gap:6px;flex-wrap:wrap}.sc-cap b{font-size:13.5px}}
.menu a{white-space:nowrap}
@media (max-width:400px){.menu a{padding:7px 4px;font-size:12.5px}.brand{font-size:13px}.theme-btn{display:none}}

section{padding-block:88px}
.band{background:var(--band)}
.eyebrow{display:block;font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.sec-head{display:flex;flex-direction:column;gap:10px;margin-bottom:40px}
.sec-head h2{font-size:clamp(28px,4vw,40px);font-weight:600}
.sec-head p{color:var(--fg-2)}
.center{text-align:center;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:500;font-size:15px;padding:13px 22px;border-radius:12px;text-decoration:none;border:1px solid transparent;cursor:pointer}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{border-color:var(--line);color:var(--fg);background:var(--surface)}
.btn:hover{transform:translateY(-1px)}
@media (prefers-reduced-motion:no-preference){.btn{transition:transform .15s}.card{transition:transform .2s,box-shadow .2s}}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:5px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag{font-family:var(--mono);font-size:12.5px;padding:3px 9px;border-radius:6px;background:var(--band);color:var(--fg-2);border:1px solid var(--line);max-width:100%}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.u{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:5px;font-weight:700}

/* hero */
.hero{padding-block:96px 80px}
.hero .wrap{display:grid;grid-template-columns:1.2fr .8fr;gap:48px;align-items:center}
.hero-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hero-links{display:flex;gap:14px}
.hero-links a{display:inline-flex;align-items:center;gap:6px;font:500 14px var(--display);color:var(--fg-2);text-decoration:none}
.hero-links a:hover{color:var(--accent)}
.hero-links a.ts svg{color:#eb531f}
.hero-links svg{width:18px;height:18px}
.hero h1{font-size:clamp(30px,4.2vw,42px);font-weight:700;margin:18px 0 22px;line-height:1.32}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .lead{font-size:18px;color:var(--fg-2);max-width:34em}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.stack-shots{position:relative;aspect-ratio:1/0.95;max-width:100%;min-width:0}
.shot-card{position:absolute;width:84%;display:flex;flex-direction:column;border-radius:18px;overflow:hidden;box-shadow:0 26px 50px -26px rgba(37,43,66,.4);border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--fg)}
.shot-card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.shot-card.s1{top:0;right:0;z-index:2}
.shot-card.s2{bottom:0;left:0;z-index:1}
.sc-cap{display:flex;align-items:baseline;gap:10px;padding:12px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--fg-3)}
.sc-cap b{font:600 15px var(--display);color:var(--fg);white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.shot-card{transition:transform .25s}.shot-card:hover{transform:translateY(-6px)}}
.shot-card:hover{z-index:3}
.resp{background:var(--code-bg);color:var(--code-fg);border-radius:20px;padding:22px 24px;font-family:var(--mono);font-size:13.5px;line-height:1.75;box-shadow:var(--shadow);min-width:0;overflow-x:auto}
.resp .bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;color:#9aa4bf;font-size:12.5px}
.resp .bar b{background:#1f9d6b;color:#fff;border-radius:6px;padding:1px 8px;font-weight:500}
.resp pre{margin:0;white-space:pre}
.k{color:var(--code-key)}.s{color:var(--code-str)}.n{color:var(--code-num)}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr;gap:40px}}

/* claims */
.claims{display:grid;gap:40px}
.claim{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:start;padding-bottom:40px;border-bottom:1px solid var(--line)}
.claim:last-child{border-bottom:0;padding-bottom:0}
.claim .big{font-family:var(--display);font-size:44px;font-weight:700;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.claim .big small{display:block;font-size:13px;font-weight:500;color:var(--fg-3);margin-top:10px;letter-spacing:0}
.claim h3{font-size:22px;font-weight:600;margin-bottom:8px}
.claim p{color:var(--fg-2);font-size:17px}
.claim p b{color:var(--fg)}
@media (max-width:640px){.claim{grid-template-columns:1fr;gap:12px}}

/* project cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;cursor:pointer}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.cover{aspect-ratio:16/9;max-width:100%;position:relative;overflow:hidden;background:var(--band);border-bottom:1px solid var(--line)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cs-cover{border:1px solid var(--line)}
.cover .soon{position:absolute;top:14px;left:14px;font-size:12px;background:rgba(255,255,255,.9);color:#252b42;padding:3px 10px;border-radius:999px;font-weight:500}
.card-body{padding:22px 22px 24px;display:flex;flex-direction:column;gap:10px;flex:1}
.card-meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.card h3{font-size:20px;font-weight:600}
.card .sub{color:var(--fg-2);font-size:15px}
.card .award{font-size:13px;color:var(--accent);font-weight:500}
.card .tags{margin-top:auto;padding-top:8px}

.sub-head{margin:64px 0 24px;padding-top:32px;border-top:1px solid var(--line);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.sub-head h3{font-size:22px;font-weight:600}
.sub-head p{color:var(--fg-3);font-size:15px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg-2);font:500 14px var(--display);padding:7px 15px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sort{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--fg-3)}
.sort select{font:500 14px var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.count{font-size:14px;color:var(--fg-3);margin-bottom:16px}

/* case study */
.cs-hero{padding-block:56px 64px}
.back{display:inline-flex;gap:6px;font-size:14px;color:var(--fg-3);text-decoration:none;margin-bottom:28px}
.back:hover{color:var(--accent)}
.cs-hero .wrap>.top{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.cs-hero h1{font-size:clamp(34px,5vw,52px);font-weight:700;margin:14px 0 12px}
.cs-hero .tagline{font-size:19px;color:var(--fg-2)}
.cs-hero .award{margin-top:18px}
.cs-cover{border-radius:24px;overflow:hidden}
@media (max-width:860px){.cs-hero .wrap>.top{grid-template-columns:1fr}}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:16px;margin-top:44px;background:var(--surface)}
.meta div{padding:18px 20px;border-right:1px solid var(--line);min-width:0}
.meta div:last-child{border-right:0}
.meta dt{font-size:12.5px;color:var(--fg-3);font-weight:500;letter-spacing:.04em;margin-bottom:4px}
.meta dd{margin:0;font-weight:500;font-size:15px}
@media (max-width:640px){.meta{grid-template-columns:1fr}.meta div{border-right:0;border-bottom:1px solid var(--line)}.meta div:last-child{border-bottom:0}}
.stack-row{display:flex;gap:16px;align-items:flex-start;margin-top:18px;flex-wrap:wrap}
.stack-row .lbl{font-size:13px;color:var(--fg-3);padding-top:3px;min-width:60px}
.stack-row .tags{flex:1;min-width:0}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.links a,.links span{font-size:14px;padding:7px 14px;border-radius:10px;border:1px solid var(--line);text-decoration:none;background:var(--surface)}
.links a{color:var(--accent);font-weight:500}
.links span{color:var(--fg-3);border-style:dashed}

.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.toc .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.toc button{flex:none;border:0;background:none;font:500 14px var(--body);color:var(--fg-3);padding:6px 12px;border-radius:8px;cursor:pointer}
.toc button:hover{color:var(--accent);background:var(--accent-soft)}

.overview{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:56px;align-items:start}
.overview h2{font-size:clamp(22px,2.6vw,26px);font-weight:600;margin:8px 0 16px}
.why p{color:var(--fg-2);font-size:15.5px;line-height:1.75}
.why p+p{margin-top:10px}
.why .goal{margin-top:20px;padding:14px 16px;border-left:3px solid var(--accent);background:var(--band);border-radius:0 10px 10px 0;color:var(--fg);font-weight:500}
.why .goal b{display:block;font-size:12.5px;color:var(--accent);font-weight:600;letter-spacing:.04em;margin-bottom:2px}
.voice{margin:0 0 16px;font-family:var(--display);font-size:clamp(17px,2vw,19px);font-weight:600;color:var(--fg);line-height:1.5}
.ov-tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:28px;margin-top:56px}
.ov-t h3{font-size:17px;font-weight:600;margin-bottom:12px}
.ov-t .tbl{margin-top:0;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.ov-t table{min-width:0}
.tbl tbody th{font-weight:600;color:var(--fg);font-size:14.5px;white-space:nowrap}
.tbl tr:last-child td,.tbl tr:last-child th{border-bottom:0}
.tnote{color:var(--fg-3);font-size:13.5px;margin-top:10px}
.op-sub{color:var(--fg-3);font-size:14.5px;margin-top:4px}
.op-list{margin-top:10px;display:grid;gap:6px}
.r-no{font-family:var(--display);font-weight:600;color:var(--accent);font-size:14px}
.retro .take{padding-top:12px;border-top:1px solid var(--line);color:var(--fg);font-weight:500}
.retro .take::before{content:"→ ";color:var(--accent)}
.tr-no{display:block;margin-bottom:10px}
.star li ul{margin-top:8px;display:grid;gap:6px;padding-left:1.1em;list-style:disc}
.cs-sum{margin-top:16px;color:var(--fg-2);font-size:16px;max-width:39em}
.hl{list-style:none;padding:0;margin:0;display:grid;gap:0;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.hl li{display:grid;grid-template-columns:28px 1fr;gap:14px;padding:18px 22px;border-top:1px solid var(--line)}
.hl li:first-child{border-top:0}
.hl .ck{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:13px;font-weight:700;margin-top:2px}
.hl b{display:block;font-family:var(--display);font-weight:600;font-size:17px;line-height:1.4}
.hl p{color:var(--fg-2);font-size:14.5px;margin-top:4px}
.hl-empty{color:var(--fg-3);font-size:15px;padding:18px 22px;border:1px dashed var(--line);border-radius:16px}
.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden}
.result{padding:22px 24px 24px;border-top:1px solid var(--line);border-left:1px solid var(--line);min-width:0}
.result:nth-child(-n+2){border-top:0}
.result:nth-child(odd){border-left:0}
.result:last-child:nth-child(odd){grid-column:1/-1}
.result dt{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--fg-3);letter-spacing:.02em}
.result dt::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.result dd{margin:0}
.result .v{display:block;font-family:var(--display);font-size:clamp(22px,2.6vw,27px);font-weight:700;color:var(--fg);line-height:1.25;margin:10px 0 6px;font-variant-numeric:tabular-nums}
.result .d{display:block;color:var(--fg-2);font-size:14.5px;line-height:1.6}
@media (max-width:900px){.overview{grid-template-columns:1fr;gap:28px}}
@media (max-width:520px){.results{grid-template-columns:1fr}.result{border-left:0!important;border-top:1px solid var(--line)!important}.result:first-child{border-top:0!important}}

.fx-group+.fx-group{margin-top:72px}
.fx-gh{font-size:20px;font-weight:600;margin-bottom:24px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.fx-list{display:grid;gap:48px}
.fx{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:48px;align-items:center}
.fx:nth-child(even) .fx-text{order:2}
.fx.small{grid-template-columns:minmax(0,1fr) minmax(0,.8fr)}
.fx-text{display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-width:0}
.fx-no{font-family:var(--display);font-weight:600;color:var(--accent);font-size:14px}
.fx-text h3{font-size:22px;font-weight:600}
.fx-tag{font:500 12.5px var(--mono);color:var(--fg-3)}
.fx-text p{color:var(--fg-2);font-size:16px}
.fx-img{all:unset;box-sizing:border-box;cursor:zoom-in;display:block;position:relative;width:100%;max-width:600px;justify-self:center;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#fff}
.fx-img img{display:block;width:100%;height:auto}
.fx-img.tall{max-height:400px}
.fx-img.tall::after{content:"";position:absolute;inset:auto 0 0 0;height:90px;background:linear-gradient(transparent,rgba(255,255,255,.95))}
.fx-img .more{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:1;font:500 13px var(--body);color:#1b86ec;background:#fff;border:1px solid #cfe0f7;border-radius:999px;padding:5px 12px;white-space:nowrap}
.fx-img:focus-visible,.fxp-img:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (max-width:820px){.fx,.fx.small{grid-template-columns:1fr;gap:18px}.fx:nth-child(even) .fx-text{order:0}}

    s:"1분마다 대상 파일을 drive_copy_jobs에 등록·복사(#235) → 최종 제출 신청서로 대상 제한(#261) → 수정·삭제로 무효가 된 사본 자동 정리(#263)",
    star:{S:"2학기 전체 도입으로 제출 서류가 늘어나면서 채점 업무가 S3에 저장된 파일에 의존하게 됐습니다. S3 접근에 문제가 생기더라도 채점자가 서류를 확인할 수 있도록 Google Drive에 별도 사본을 보관하기로 했습니다.",
      T:"파일을 단순히 복사하는 것만으로는 해결되지 않았습니다. 운영·개발 파일이 섞여 있었고, 브라우저의 업로드와 DB 등록 시점이 달랐으며, 신청서가 수정되면 이전 파일이 더 이상 유효하지 않을 수 있었습니다. 외부 API가 실패하거나 서버가 재시작돼도 작업이 유실되지 않아야 했습니다.",
      A:["<b>1) DB 기반 작업 큐 구축 (#235)</b><ul><li><b>개발 파일 혼재</b> — Terraform으로 운영 전용 버킷을 분리하고, 버킷 전체가 아니라 운영 DB에 등록된 S3 키만 백업 대상으로 삼았습니다.</li><li><b>파일의 소속 정보 부족</b> — 신청서·학생·장학금·학기를 조인해 <code>학기 / 장학금 / 이름_학번</code> 폴더 구조로 저장했습니다(#259에서 순서 조정).</li><li><b>DB 등록과 S3 업로드 시점 차이</b> — <code>headObject</code>로 존재를 확인하고, 없으면 재시도를 예약했습니다.</li><li><b>작업 유실·중복 방지</b> — 버킷 + S3 키 해시로 작업 ID를 만들고 <code>PENDING → PROCESSING → SENT</code> 상태와 다음 시도 시각을 저장했습니다. 처리 중 종료된 작업은 15분 점유 시간이 지나면 다시 처리합니다.</li><li><b>인증 유지</b> — OAuth Refresh Token을 SSM Parameter Store(SecureString)에 보관해 읽기 전용으로 마운트하고, 인증 만료를 피하려고 OAuth 앱을 프로덕션으로 게시했습니다.</li></ul>","<b>2) 운영 중 발견 — 제출하지 않은 파일까지 백업 (#261)</b> — 팀원이 검증용으로 올린 파일이 Drive에 복사되는 것을 발견했습니다. 파일이 DB에 등록됐는지만 보고 최종 제출 여부는 확인하지 않았기 때문입니다. 대상을 제출 상태(SUBMITTED 이후)이면서 제출 시각이 있는 신청서의 파일로 제한하고, 탐색 기준 시각은 파일 수정 시각과 제출 시각 중 늦은 값으로 잡았습니다.","<b>3) 신청서를 수정하면 이전 파일은? (#263)</b> — 파일 정보가 삭제됐거나, 신청서가 제출 상태가 아니거나, 재업로드로 S3 키가 바뀐 사본을 무효로 보고 Drive 휴지통으로 옮긴 뒤 <code>OBSOLETE</code>로 바꿨습니다. 다시 제출되면 <code>PENDING</code>으로 되돌려 재백업합니다. 파일 교체 시에는 새 파일이 <code>SENT</code>가 된 뒤에만 이전 사본을 정리했고, 정리 기능은 <code>cleanup-enabled</code> 플래그와 Dry-run으로 대상 건수부터 확인한 뒤 켰습니다."],
      R:"운영 S3의 제출 서류를 1분 간격으로 탐색해 Google Drive에 장학금·학생별로 정리할 수 있게 됐습니다. 서버 재시작이나 외부 API 오류가 나도 DB의 작업 상태를 기준으로 재처리하며, 동기화가 끝난 시점에는 현재 최종 제출 상태에 맞는 서류만 Drive에 남습니다."},
    l:"백업은 단순한 파일 복사로 끝나지 않았습니다. 대체 자료로 쓰려면 원본의 상태 변화까지 반영하는 동기화 정책이 필요했고, 새 백업이 끝난 뒤 이전 사본을 정리하는 순서를 설계하며 데이터 보존과 정합성을 함께 고려하는 법을 배웠습니다."},
   {t:"응답은 정상인데 프론트 타입이 생성되지 않는다 → 제네릭 반환 타입으로 Swagger 스키마 전역 보정",
    p:"BaseResponse&lt;T&gt; 제네릭을 Swagger가 해석하지 못해 200 응답 스키마가 비었고, 프론트엔드의 API 타입 자동 생성(generate:api)이 동작하지 않았습니다",
    d:"API마다 문서용 클래스를 추가하는 대신, 컨트롤러에 이미 선언된 제네릭 반환 타입을 읽어 스키마를 자동 생성하도록 했습니다",
    s:"OperationCustomizer로 반환 타입을 분석하고 ModelConverters로 스키마를 생성해 200 응답에 주입",
    star:{S:"프론트엔드는 OpenAPI 명세를 기반으로 API 타입을 자동 생성했고, 백엔드 응답은 모두 BaseResponse&lt;T&gt;로 감싸는 구조였습니다.",T:"200 응답에 <code>useReturnTypeSchema = true</code>를 적용하자, 실제 응답은 정상인데 명세에서 result의 DTO 타입이 누락돼 프론트가 응답 타입을 생성하지 못했습니다.",
      A:["<b>원인 분리</b> — API 응답 오류가 아니라, Springdoc이 BaseResponse&lt;T&gt;의 제네릭 타입을 해석하지 못하는 명세 생성 문제임을 확인했습니다.","<b>대안 1 — API별 Wrapper 클래스</b> — 스키마는 정상 생성됐지만 API마다 비즈니스와 무관한 클래스가 늘어 유지보수 부담이 커졌습니다.","<b>대안 2 — 전역 스키마 보정 (채택)</b> — <code>getGenericReturnType()</code>으로 반환 타입을 추출하고, Swagger Core의 <code>ModelConverters</code>로 DTO 스키마를 만들어 <code>OperationCustomizer</code>에서 200 응답에 적용했습니다. 참조 DTO는 <code>OpenApiCustomizer</code>로 components에 등록하고, 기존 @ApiResponse 설명은 유지한 채 스키마만 교체했습니다."],
      R:"컨트롤러 코드를 수정하지 않고 전체 API의 200 응답에 실제 DTO 스키마를 연결했습니다. 프론트 타입 자동 생성이 정상화됐고, 새 API에도 같은 설정이 적용됩니다."},
    l:"개별 API에 예외 처리를 더하기보다, 공통 응답 구조와 문서 생성 사이의 문제를 해결하는 편이 유지보수에 유리했습니다. 이미 있는 타입 정보를 재사용해 반복 작업을 없앤 경험이었습니다."},
   {t:"서버는 업로드가 끝났는지 모른다 → 최종 제출 시점에 서버가 파일 목록을 확정",
    p:"브라우저가 S3에 직접 업로드하기 때문에, DB에는 파일 정보가 있지만 S3에는 객체가 없거나 학생이 취소한 파일이 남은 채로 제출될 수 있었습니다",
    d:"모든 파일 선택·취소 상황을 개별 API로 처리하지 않고, 최종 제출 요청을 기준으로 서버가 유효한 파일 목록을 확정하도록 했습니다",
    s:"제출·수정 요청에 최종 파일 종류 목록을 받고, S3 객체 존재 여부를 검증해 제출 데이터를 정리",
    star:{S:"업로드는 Presigned URL 발급 → DB에 파일 정보 등록 → 브라우저가 S3에 직접 업로드 순서였습니다. 업로드 부하는 줄였지만, 서버는 실제 업로드 완료 여부를 알 수 없었습니다.",T:"파일을 골랐다가 취소하거나 업로드 중 네트워크가 끊겨도 DB에는 파일 정보가 남았습니다. 시범 도입 전에, 열 수 없는 파일이나 낼 생각이 없던 파일이 제출되는 것을 막아야 했습니다.",
      A:["<b>첫 번째 시도 — 파일 선택 취소 API</b> — 취소할 때마다 프론트가 삭제 API를 호출하게 했지만, 모든 취소 경로에서 빠짐없이 호출해야 했고 브라우저 종료나 업로드 중단은 처리할 수 없었습니다.","<b>설계 변경 — 최종 제출 시 서버가 확정</b> — 하루 만에 취소 API를 지우고, 제출·수정 요청에 최종 파일 종류 목록을 받도록 바꿨습니다. 목록에 없는 파일과 S3에 없는 파일은 정리하고, 제출 대상 파일의 S3 존재를 검증해 없으면 제출을 막았습니다. 선택 첨부 서류는 목록에 없으면 제외됩니다.","<b>삭제 경로 정리</b> — 신청서 삭제 시 파일 정보도 함께 정리하고, S3 키를 <code>prefix/신청서ID/uuid/원본파일명</code> 구조로 바꿔 신청서별로 구분하고 이름 충돌을 막았습니다."],
      R:"업로드가 끝나지 않은 파일이 제출 데이터에 포함되는 문제를 막았고, 이 구조로 공인어학 장학금 시범 운영 2주간 Sentry 기준 운영 오류 0건을 기록했습니다."},
    l:"보장해야 하는 것은 파일 선택 취소라는 개별 동작이 아니라 최종 제출 데이터의 정합성이었습니다. 최종 시점에 서버가 검증 책임을 갖도록 설계해 클라이언트의 중간 동작에 대한 의존을 줄였습니다."},
   {t:"새로고침할 때마다 지원자 순서가 바뀐다 → 정렬 마지막에 고유 키 추가",
    p:"정책국 QA 중 지원자 관리 페이지를 새로고침할 때마다 같은 신청자들의 순서가 바뀌었습니다",
    d:"화면 순서가 달라지는 것보다, 같은 원인으로 페이지 경계에서 지원자가 중복되거나 누락될 위험이 더 중요하다고 판단했습니다",
    s:"모든 정렬 조건의 마지막에 신청서 ID 오름차순을 추가해 정렬 순서를 고정",
    star:{S:"채점 시작 전 정책국이 백오피스를 직접 쓰는 QA를 진행했습니다. 지원자 관리 페이지는 제출 시각 내림차순이 기본이고, 학번 등으로도 정렬할 수 있었습니다.",T:"정렬을 바꾸지 않았는데도 새로고침마다 순서가 달라진다는 제보가 들어왔습니다. 채점자가 지원자를 배정하고 확인하는 화면이라, 정렬이 불안정하면 업무 진행 상태를 추적하기 어려웠습니다.",
      A:["<b>원인 확인</b> — 정렬은 백엔드 QueryDSL에서 처리했고, 기본 정렬이 제출 시각 한 컬럼뿐이었습니다. 값이 같으면 MariaDB는 순서를 보장하지 않습니다. 학번도 한 학생이 여러 장학금을 신청하면 중복됩니다.","<b>페이지네이션 영향 분석</b> — LIMIT/OFFSET 방식이라, 같은 값의 순서가 요청마다 달라지면 페이지 경계에서 지원자가 중복 조회되거나 누락될 수 있었습니다.","<b>고유 키를 마지막 정렬 기준으로</b> — 기본 정렬뿐 아니라 모든 정렬 조건의 마지막에 신청서 ID 오름차순을 추가했습니다."],
      R:"같은 데이터와 조건에서 새로고침해도 순서가 일관되게 유지되고, 페이지 간 중복·누락 위험을 줄였습니다. 프론트 수정 없이 백엔드 쿼리만 바꿔 신청 마감 전에 반영했습니다."},
    l:"단순한 화면 정렬 문제로 보였지만, 실제로는 채점 대상 누락으로 이어질 수 있는 조회 문제였습니다. 드러난 현상뿐 아니라 그 현상이 운영 흐름에 미치는 영향까지 분석해야 합니다."}
  ],
  ops:[
   {t:"운영 DB 백업 이중화",sub:"장애 유형별로 복구 경로를 나눈 자동 백업",p:"운영 DB에 자동 백업이 없어 디스크 장애나 오삭제 시 복구하기 어려웠습니다. 스냅샷만 쓰면 슈포트 DB만 골라 복원하기 어렵고, 논리 백업만 쓰면 서버·디스크 전체 장애에 대응하기 번거로웠습니다.",
    tbl:{head:["대비할 장애","백업 방식","주기 · 보관"],rows:[["서버·디스크 장애","EBS Snapshot (AWS DLM, 태그로 운영 DB 볼륨 지정)","24시간마다 · 최근 7개"],["데이터 오삭제","mariadb-dump --single-transaction → gzip → S3","매일 03:00 · 30일 (S3 Lifecycle)"]]},
    s:["<b>실패 감지</b> — <code>set -euo pipefail</code>과 <code>gzip -t</code> 검사, S3 업로드 성공 시에만 임시 파일 삭제","<b>접근 권한 제한</b> — DB 비밀번호는 root 전용 600 권한 파일, S3 접근은 EC2 IAM Role. 서버에는 백업 삭제 권한을 주지 않고 Lifecycle로 만료 관리","<b>설정 코드화</b> — 백업 스크립트, systemd timer, DLM 정책을 Terraform으로 관리 (#153)"],
    r:"서버·디스크 장애에는 EBS Snapshot, 특정 데이터 복구에는 논리 백업을 쓸 수 있게 됐고, 백업 주기와 보관 정책을 코드로 재현할 수 있습니다. 실제 복원 테스트 결과는 검증 후 추가할 예정입니다."},
   {t:"서버 기준 API 모니터링",sub:"브라우저 이벤트가 아닌 서버가 실제로 받은 요청으로 API 상태를 관측",p:"브라우저 이벤트는 실제 서버 처리 결과와 차이가 있었습니다(최종 제출 GA4 200건 vs DB 207건). 2학기 전체 도입을 앞두고 API 요청량, 오류율, 응답 시간을 서버 기준으로 볼 도구가 필요했습니다.",
    s:["<b>요청 로그</b> — 필터에서 API 요청의 method · uri · status · 응답 시간 기록 (#120)","<b>로그·지표 수집</b> — CloudWatch Agent로 EC2 메모리·디스크 지표와 Docker 로그 수집","<b>재배포 대응</b> — 컨테이너 ID가 바뀌어도 이어지도록 <code>/var/lib/docker/containers/*/*-json.log</code> 경로 사용","<b>대시보드</b> — API별 p95 응답 시간, HTTP 오류율, 1분 평균 RPS"],
    r:"서버가 실제로 처리한 요청 기준으로 API 상태를 관측할 수 있게 됐고, 팀 부하테스트에서도 이 대시보드로 p95, 실패율 1% 미만, 목표 RPS 기준을 확인했습니다."},
   {t:"IAM 권한 정리와 Terraform 코드화",sub:"콘솔에서 관리하던 개발자 권한을 기존 권한 변경 없이 코드로 이관",p:"IAM 권한을 콘솔에서 직접 관리해 변경 이력을 리뷰로 추적하기 어려웠습니다. 사용자 19명 중 일부는 여러 그룹에 속해 있어, 이관 중 권한이 하나라도 바뀌면 다른 서비스 운영에 영향을 줄 수 있었습니다.",
    s:["<b>역할별 권한 구분</b> — 공통 개발자 그룹은 조회와 로그 확인, 슈포트 그룹은 슈포트 리소스 운영 권한. 인스턴스 종료 등 파괴적 권한은 제한","<b>기존 설정 확인</b> — AWS CLI로 그룹과 정책의 Action · Resource · Condition을 조회해 코드에 반영","<b>모듈 분리</b> — 공통은 global, 슈포트는 ssuport/iam 모듈. 다른 프로젝트의 그룹 소속은 제외하고 prevent_destroy 적용","<b>Import 방식 이관</b> — 사용자 · 그룹 · 정책 · 소속 58개를 Import 블록으로 연결"],
    r:"<code>terraform plan</code> 결과 <b>Import 58 · 생성 0 · 변경 0 · 삭제 0</b>을 확인해, 기존 권한을 바꾸지 않고 Terraform 관리로 전환했습니다(#155). 이후 권한 변경은 코드와 PR에서 검토합니다."}],
  retro:[{t:"운영 오류가 없더라도, 사용자가 끝까지 신청했는지는 별개의 문제",body:["시범 운영에서 실제 신청 207건을 처리했고 Sentry 감지 오류는 0건이었지만, 그것만으로 모든 사용자가 원활하게 신청을 마쳤다고 볼 수는 없었습니다.","GA4 기준 신청을 시작한 1,333명 대비 최종 제출은 207건입니다. 단순 계산으로 약 15%지만, 대상이 아닌 방문자가 포함됐을 수 있고 클라이언트 이벤트와 DB 집계 기준도 달라 정확한 전환율로 보기는 어렵습니다. 업로드 이벤트가 최종 제출의 약 4.6배였지만, 서버에 파일 검증 실패 이유가 남지 않아 어느 단계에서 막혔는지 확인할 수 없었습니다."],imp:"최종 제출 성공을 DB 저장 완료 시점에 서버에서 기록하고, 파일 형식·용량 등 업로드 검증 실패 사유를 로그로 수집하며, 신청 단계별 이탈 지표를 설계하겠습니다.",take:"서비스 안정성은 서버가 오류 없이 동작했는지뿐 아니라 사용자가 실제로 목표를 완료했는지까지 봐야 합니다. 측정 기준이 다른 데이터는 단순 비교하지 말고, 무엇을 믿고 무엇을 더 측정할지 구분해야 합니다."},
         {t:"장학금이 늘어날수록 개발자가 필요한 구조",body:["장학금이 1종에서 4종으로 늘면서 장학금마다 다른 체크리스트·채점 정보·탈락 사유를 추가해야 했습니다. 정책이 코드에 들어 있어, 장학금이 추가되거나 기준이 바뀌면 개발자가 수정하고 배포해야 합니다. 담당자가 매년 바뀌는 학생 조직에서는 장기 운영에 부담이 됩니다."],imp:"체크리스트 문항과 탈락 사유를 데이터로 관리하고, 운영자가 백오피스에서 장학금별 채점 기준을 수정하며, 장학금 추가 시 공통 기능을 재사용할 수 있게 하겠습니다.",take:"운영되는 서비스에서는 운영자가 개발자 도움 없이 정책을 관리할 수 있게 만드는 것도 기능만큼 중요합니다."}]

  why:["성인 ADHD 사용자는 목표를 작은 행동으로 나누고 이어가는 실행 기능에서 막히지만, 기존 할 일 앱은 이 과정을 사용자에게 맡깁니다.","캥거루틴은 실행 기능 개선 효과가 보고된 목표관리훈련(GMT)의 5단계를 앱의 사용 흐름에 적용했습니다. 별도의 훈련 과정 없이, 목표를 설정하고 실행·점검하는 일상적인 활동을 통해 GMT의 사고 순서를 반복하도록 설계했습니다.","실행이 막히는 순간에는 AI 상담가 Kelper가 함께합니다. 동기가 부족할 때는 MI(동기강화상담), 부정적인 생각이 반복될 때는 CBT(인지행동치료) 기반 대화로 다음 행동을 찾도록 돕습니다."],

  archImg:"arch_kang", archLead:"도메인별로 나눈 서비스 3개를 Gateway 하나 뒤에 두고, 코드를 푸시하면 NKS까지 자동으로 배포되는 구조입니다.",
  points:[["도메인별 책임 분리와 독립 배포","회원·인증(Member), 목표·AI(Planner), 일정(Engagement)을 독립된 서비스로 나눴습니다. 서비스마다 이미지와 Deployment가 따로 있어 하나를 고쳐도 나머지는 그대로 동작하고, 요청이 몰리는 일정 서비스만 따로 늘릴 수 있습니다."],["단일 진입점 API Gateway","외부에는 Gateway만 LoadBalancer로 열고, 내부 서비스는 ClusterIP로 두었습니다. 경로 기반 라우팅, JWT 검증(공개 경로 화이트리스트), CORS, Swagger 통합을 Gateway에 모았습니다."],["서비스별 데이터 소유권","MySQL 하나에 member_db · planner_db · engagement_db 스키마를 나눴습니다. 다른 서비스의 데이터는 OpenFeign으로 내부 API(/internal/**)를 호출해 가져오고, DB 데이터는 PVC(20Gi)에 저장합니다."],["설정·비밀·권한을 이미지 밖으로","설정은 ConfigMap, 인증 정보는 Secret으로 주입해 같은 이미지를 환경만 바꿔 배포합니다. 조회 권한만 가진 ServiceAccount, 서비스별 CPU·메모리 한도와 헬스체크를 두었습니다."],["푸시 한 번에 배포까지","SourceCommit → SourceBuild(JAR 빌드·이미지 생성) → NCR → SourceDeploy를 SourcePipeline으로 연결해, 푸시하면 4개 서비스가 NKS에 자동 배포됩니다."]],
  work:[["팀 리딩","",["저장소 개설, 이슈·PR 템플릿과 master / develop / feature/* 브랜치 전략으로 협업 규칙 수립","기획 변경 때 단일 프로젝트를 전면 리팩터링하고 MSA 구조로 재설계","공모전 신청서의 아키텍처·인프라·CI/CD 파트를 작성하고 팀 대표로 제출"]],
        ["Backend","전체 커밋 109개 중 67개 (머지 제외)",["<b>API Gateway</b> — 경로 기반 라우팅, JWT 인증 필터, CORS, 서비스 3개의 Swagger 통합","<b>Member Service</b> — 카카오 로그인, Access · Refresh 토큰 발급과 재발급, 프로필 수정 · 탈퇴, 서비스 간 회원 조회 API","<b>Engagement Service</b> — 일정 등록 · 조회 · 삭제, 요일 반복 일정, 월간 캘린더, OpenFeign 기반 서비스 간 통신, 공통 응답 · 예외 처리"]],

  troubles:[
   {t:"Docker 내부 Gradle 빌드 실패 → 빌드와 이미지 패키징을 분리해 CI/CD 복구",
    p:"SourceBuild에서 Docker 이미지 안의 Gradle 빌드가 계속 실패해 4개 서비스 배포가 모두 멈춤",
    d:"통제할 수 없는 빌드 환경에 값을 맞추는 대신, 실패하는 단계(Docker 안 Gradle 빌드) 자체를 없앴습니다",
    s:"JAR는 SourceBuild에서 빌드하고, Dockerfile은 JRE에 JAR만 담는 구조로 분리",
    star:{S:"SourcePipeline으로 서비스 4개를 NKS에 자동 배포하려 했고, Dockerfile은 JDK 이미지에서 빌드해 JRE 이미지로 옮기는 멀티스테이지 구조였습니다.",T:"로컬에서는 되는 빌드가 SourceBuild에서만 실패해 파이프라인 전체가 멈췄고, 마감 안에 배포 경로를 확보해야 했습니다.",
      A:["<b>가설 1. 환경 차이</b> — .gitignore의 .jar 규칙으로 빠져 있던 gradle-wrapper.jar와, 지원이 끝난 openjdk 베이스 이미지를 찾아 고쳤지만 실패는 계속됐습니다.","<b>가설 2. 빌드 컨테이너의 자원 한도</b> — JVM은 GC·JIT·Gradle 워커마다 스레드를 만들기 때문에, 컨테이너의 스레드 수(pids.max)나 메모리 한도에 걸릴 수 있다고 봤습니다. 한도를 출력하고 JVM 자원 사용을 줄여봤지만 원인을 확정하지 못했습니다.","<b>판단 → 실패하는 단계를 없앴다</b> — 튜닝은 통제할 수 없는 환경에 값을 맞추는 것이라 다시 깨질 수 있습니다. JAR는 SourceBuild에서 빌드하고, Dockerfile은 JRE에 JAR만 담도록 분리했습니다. JAR 이름은 서비스명으로 고정해 Dockerfile이 항상 같은 파일을 복사하게 했습니다."],
      R:"4개 서비스가 모두 배포됐고, Dockerfile은 20여 줄에서 9줄로 줄었으며 실행 이미지에서 JDK·Gradle이 빠졌습니다."},
    l:"설정값만 바꾸는 시도가 길어지면, 그 작업이 꼭 그 자리에서 일어나야 하는지부터 따져봐야 합니다."},
   {t:"yml을 고쳐도 그대로였던 DB 연결 → 환경 변수가 설정을 덮어쓰고 있었다",
    p:"첫 배포에서 MySQL이 뜨지 않았고, 뜬 뒤에도 앱 3개가 DB에 연결하지 못함",
    dk:"핵심 원인", d:"앱이 실제로 읽던 DB 주소는 yml이 아니라 ConfigMap의 환경 변수였고, 그 값이 틀려 있었다",
    s:"StorageClass를 클러스터에 있는 것으로 바꾸고, ConfigMap의 DB 주소를 실제 Service 이름으로 수정",
    star:{S:"서비스 3개가 MySQL 하나를 스키마로 나눠 쓰고, DB 주소는 ConfigMap으로 주입했습니다.",T:"첫 배포에서 MySQL이 Pending에 멈추고 앱 3개가 DB에 연결하지 못했습니다.",
      A:["<b>MySQL이 뜨지 않았다 → 볼륨 미생성</b> — 없는 StorageClass(<code>ncloud-csi-gp2</code>)를 참조해 볼륨이 생기지 않았고, <code>nks-block-storage</code>로 바꿔 해결했습니다.","<b>앱이 연결 못 한다 → 호스트 불일치</b> — DB 호스트(<code>mysql</code>)가 실제 Service 이름(<code>mysql-service</code>)과 달랐습니다.","<b>고쳤는데 그대로다 → 진짜 원인</b> — yml을 두 번 고쳤도 같았습니다. ConfigMap의 <code>SPRING_DATASOURCE_URL</code>이 환경 변수로 들어가 있었고, Spring Boot는 환경 변수를 yml보다 우선합니다. ConfigMap을 고치자 바로 연결됐습니다."],
      R:"MySQL과 서비스 4개가 모두 정상화돼, 팀원들이 실제 클러스터에서 기능을 확인할 수 있게 됐습니다."},
    l:"설정을 고쳤는데 그대로라면, 고친 곳이 아니라 그 값이 실제로 어디서 오는지부터 확인해야 합니다."}

      A:["<b>스키마부터 맞췄다</b> — 네이버 일정의 시즌 · 라운드 · 그룹 구조를 담을 수 있게 라운드, 그룹, 라운드별 참가 팀 엔티티를 추가했습니다.","<b>주기를 둘로 나눴다</b><div class=\"tbl\"><table><thead><tr><th>작업</th><th>주기</th><th>범위</th></tr></thead><tbody><tr><td>확정 일정 동기화</td><td>1시간</td><td>이번 주부터 앞으로, 2주 연속 확정 경기가 없으면 탐색 중단 (최대 30주)</td></tr><tr><td>실시간 결과 동기화</td><td>1분</td><td>이번 주 경기 중 진행 중·종료·점수가 있는 경기만</td></tr></tbody></table></div>대진이 정해지지 않은 경기(TBD)는 건너뛰고, 확정된 경기만 반영했습니다.","<b>세트는 점수 차이로 한 개씩 기록했다</b> — 저장된 세트 승수와 현재 점수를 비교해, 한 팀 점수가 1 늘었을 때만 다음 세트를 만들고 승자를 기록했습니다. 한 번에 2세트 이상 늘거나 맞지 않는 변화는 잘못된 세트를 만들지 않고 경고 로그로 남겼습니다.","<b>경기 상태를 결과에서 정했다</b> — 종료 표시가 있으면 점수로 승패를 정하고, LIVE 표시·점수·다시보기 URL 중 하나라도 있으면 진행 중으로 봤습니다."],

      A:["<b>자리가 없다 → requests 합 초과</b> — 스케줄러는 실제 사용량이 아니라 requests 합으로 파드를 배치합니다. 5 × 250m = 1,250m에 시스템 파드의 requests까지 더하면 노드 할당량을 넘습니다. 노드 증설은 제공 자원을 넘고 서비스 통합은 MSA 설계와 맞지 않아, requests 100m · limits 250m로 낮췄습니다.","<b>떠도 Ready가 안 된다 → 헬스체크가 401</b> — 프로브를 <code>/actuator/health/liveness</code>, <code>/readiness</code>로 나눴는데 Gateway Security는 <code>/actuator/health</code>만 허용하고 있었습니다. liveness 실패로 재시작되고 readiness 실패로 트래픽에서 빠졌기에, 상태값만 노출되는 <code>/actuator/health/**</code>를 허용했습니다.","<b>limits를 낮춘 부작용 → 느린 기동</b> — CPU limit은 CFS quota로 동작해, 250m이면 100ms마다 25ms만 CPU를 씁니다. 기동 때 CPU를 많이 쓰는 Spring Boot가 다 뜨기 전에 liveness에 죽을 수 있어 프로브 대기 시간을 늘렸습니다. 팀원과 함께 프로브를 liveness · readiness 그룹으로 나눠 DB 장애가 앱 재시작으로 번지지 않게 했습니다."],
      R:"5개 파드가 모두 Ready가 되어 Load Balancer로 API와 Swagger에 접근할 수 있게 됐습니다."},
    l:"requests는 스케줄링을 위한 예약값, limits는 상한입니다. 자원이 적을수록 두 값과 프로브를 함께 설계해야 합니다."},

  retroIntro:"프로젝트가 끝난 뒤 결제·재고 흐름을 다시 읽으며, 정상 흐름만 가정하고 만든 부분을 발견했습니다.",

function fillProjects(){
  let list=P.filter(p=>state.filter==="all"||p.cats.includes(state.filter));
  if(state.sort!=="pick"){
    list=[...list].sort((a,b)=>{ if(!a.end) return 1; if(!b.end) return -1;
      return state.sort==="recent" ? (b.end-a.end)||(b.start-a.start) : (a.start-b.start); });
  }
  const hack=list.filter(p=>p.cats.includes("hackathon")), main=list.filter(p=>!p.cats.includes("hackathon"));

  </div></section>

  <section id="sec-features"><div class="wrap">
    <div class="sec-head center"><span class="eyebrow">Features</span><h2>주요 기능</h2>${(p.fx||p.fxGroups)?'<p>화면을 누르면 크게 볼 수 있어요. 파란 배지는 제가 만든 API가 쓰이는 곳입니다.</p>':''}</div>

  else if(h==="about"){html=viewAbout();nav="about";}
  else if(h==="skills"){html=viewSkills();nav="skills";}
  else if(h==="contact"){html=viewContact();nav="contact";}
  else html=viewHome();
  app.innerHTML=html;
  document.querySelectorAll("[data-nav]").forEach(a=>{ if(a.dataset.nav===nav) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  if(h==="projects") fillProjects();
  if(h==="contact") loadPosts();
  document.querySelectorAll('section[id^="sec-"]').forEach((s,i)=>s.classList.toggle("band",i%2===1));
  window.scrollTo(0,0);
}

  const cp={copyMail:["ally0204@naver.com","#mail","메일 주소"],copyPhone:["010-7228-9731","#phone","전화번호"]}[e.target.id];

});
app.addEventListener("change",e=>{ if(e.target.id==="sortSel"){state.sort=e.target.value;fillProjects();} });
const lb=$("#lightbox");
function openZoom(k,alt){lb.querySelector("img").src=IMG[k];lb.querySelector("img").alt=alt;lb.hidden=false;lb.querySelector("button").focus();}
function closeZoom(){lb.hidden=true;lb.querySelector("img").removeAttribute("src");}
lb.addEventListener("click",closeZoom);
addEventListener("keydown",e=>{if(e.key==="Escape"&&!lb.hidden)closeZoom();});
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2000);}
$("#themeBtn").addEventListener("click",()=>{
  const r=document.documentElement; const cur=r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  r.setAttribute("data-theme",cur==="dark"?"light":"dark");
});
addEventListener("hashchange",route);
